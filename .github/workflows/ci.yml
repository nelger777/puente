name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: puente
          POSTGRES_PASSWORD: puente
          POSTGRES_DB: puente_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U puente -d puente_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports:
          - 1025:1025
          - 8025:8025
    env:
      # prisma generate needs a URL; tests use TEST_DATABASE_URL.
      DATABASE_URL: postgresql://puente:puente@localhost:5432/puente
      TEST_DATABASE_URL: postgresql://puente:puente@localhost:5432/puente_test
      SMTP_URL: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: puente
          POSTGRES_PASSWORD: puente
          POSTGRES_DB: puente_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U puente -d puente_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CI: "true"
      DATABASE_URL: postgresql://puente:puente@localhost:5432/puente
      E2E_DATABASE_URL: postgresql://puente:puente@localhost:5432/puente_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @puente/widget exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/*/playwright-report
          retention-days: 7

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: puente
      POSTGRES_PASSWORD: puente
      POSTGRES_DB: puente
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puente -d puente"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  pgdata:
